name: x4-orbit firmware

# Builds the personal X4 profile (env:x4-orbit) and uploads firmware-x4-orbit.bin.
# Runs on pushes to the x4-orbit branch, and on demand from the Actions tab.
on:
  push:
    branches: [x4-orbit]
    paths-ignore: ['README.md', 'docs/**']  # docs-only changes don't need a firmware build
  workflow_dispatch:

permissions:
  contents: write  # publishes the x4-orbit-latest release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      # Same toolchain setup as ci.yml's firmware build.
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-x4-orbit-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-v3-${{ runner.os }}-x4-orbit-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e x4-orbit
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Host unit tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test -j"$(nproc)"
          ctest --test-dir build/test --output-on-failure -j"$(nproc)"

      - name: Build x4-orbit firmware
        run: |
          set -euo pipefail
          pio run -e x4-orbit | tee pio.log
          {
            echo "## x4-orbit firmware"
            grep -E "RAM:\s" -m1 pio.log | sed 's/^/- /' || true
            grep -E "Flash:\s" -m1 pio.log | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          cp .pio/build/x4-orbit/firmware.bin firmware-x4-orbit.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: firmware-x4-orbit.bin
          path: firmware-x4-orbit.bin
          if-no-files-found: error

      # A rolling pre-release holding the newest build: a stable download link
      # (releases/download/x4-orbit-latest/firmware-x4-orbit.bin) that does not
      # expire like run artifacts.
      - name: Publish x4-orbit-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Flash via Settings > SD Card Firmware Update."
          if gh release view x4-orbit-latest >/dev/null 2>&1; then
            gh release upload x4-orbit-latest firmware-x4-orbit.bin --clobber
            gh release edit x4-orbit-latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create x4-orbit-latest firmware-x4-orbit.bin --prerelease \
              --title "x4-orbit (latest build)" --notes "$notes" --target "$GITHUB_SHA"
          fi
